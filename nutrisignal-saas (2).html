// EU NUTRITION CLAIMS PAGE
// ════════════════════════════════════════════════════════════════════
const ClaimsPage = ({products}) => {
  const [selected, setSelected] = useState(null);
  const [filterStatus, setFilterStatus] = useState('all'); // all | eligible | ineligible | missing
  const [search, setSearch] = useState('');
  const [viewMode, setViewMode] = useState('product'); // product | matrix

  // Calculate claims for all products
  const allClaims = useMemo(()=>
    products.map(p=>({
      product: p,
      claims: Claims.evaluate(p),
      eligible: Claims.eligible(p),
    })), [products]);

  const filtered = useMemo(()=>
    allClaims.filter(c =>
      (!search || c.product.name.toLowerCase().includes(search.toLowerCase()) ||
       c.product.category?.toLowerCase().includes(search.toLowerCase()))
    ), [allClaims, search]);

  const selectedClaims = selected
    ? allClaims.find(c=>c.product.id===selected)
    : null;

  // All unique claim names
  const CLAIM_NAMES = [
    'Low energy','Energy-reduced',
    'Low fat','Fat-free',
    'Low saturated fat','Saturated fat-free',
    'Low sugar','Sugar-free','No added sugars','Reduced sugars',
    'Low salt','Very low salt','Salt-free','Low sodium',
    'Source of fibre','High fibre',
    'Source of protein','High protein',
  ];

  const CLAIM_GROUPS = [
    {label:'⚡ Energy', claims:['Low energy','Energy-reduced']},
    {label:'🧈 Fat', claims:['Low fat','Fat-free','Low saturated fat','Saturated fat-free']},
    {label:'🍬 Sugars', claims:['Low sugar','Sugar-free','No added sugars','Reduced sugars']},
    {label:'🧂 Salt', claims:['Low salt','Very low salt','Salt-free','Low sodium']},
    {label:'🌾 Fibre', claims:['Source of fibre','High fibre']},
    {label:'🥩 Protein', claims:['Source of protein','High protein']},
  ];

  const statusBg = {
    eligible:    'rgba(30,122,69,.13)',
    ineligible:  'rgba(179,58,46,.1)',
    insufficient:'rgba(200,98,26,.1)',
    benchmark:   'rgba(155,170,148,.12)',
    formulation: 'rgba(155,170,148,.12)',
  };
  const statusColor = {
    eligible:    '#1E7A45',
    ineligible:  'var(--red)',
    insufficient:'var(--amber)',
    benchmark:   'var(--text3)',
    formulation: 'var(--text3)',
  };
  const statusLabel = {
    eligible:    '✓ Eligible',
    ineligible:  '✗ Ineligible',
    insufficient:'⚠ Insufficient data',
    benchmark:   '○ Benchmark required',
    formulation: '○ Formulation data required',
  };
  const statusIcon = {
    eligible:'✓', ineligible:'✗', insufficient:'⚠', benchmark:'○', formulation:'○',
  };

  if (!products.length) return (
    <div className="empty" style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-xl)'}}>
      <div className="empty-icon">🏷</div>
      <h3>No products loaded</h3>
      <p>Add products to evaluate EU nutrition claims (EC 1924/2006)</p>
    </div>
  );

  return (
    <div className="fade-in">

      {/* Header strip */}
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:'14px 20px',marginBottom:18,display:'flex',alignItems:'center',gap:14,boxShadow:'var(--shadow)'}}>
        <div style={{width:36,height:36,borderRadius:8,background:'rgba(58,107,74,.1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>🏷</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:14,color:'var(--text)'}}>EU Nutrition Claims — EC 1924/2006</div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:1}}>
            Valid for EU / Spain (AESAN). {products.length} products analysed · {allClaims.reduce((s,c)=>s+c.eligible.length,0)} total eligible claims across portfolio.
          </div>
        </div>
        <div style={{display:'flex',background:'var(--bg3)',borderRadius:8,padding:3,gap:2,border:'1px solid var(--border)'}}>
          {[{id:'product',icon:'☰',label:'By product'},{id:'matrix',icon:'▦',label:'Matrix'}].map(m=>(
            <button key={m.id} onClick={()=>setViewMode(m.id)}
              style={{padding:'6px 14px',border:'none',borderRadius:6,cursor:'pointer',fontFamily:'var(--sans)',fontSize:12,fontWeight:600,transition:'all .15s',
                background:viewMode===m.id?'var(--card)':'transparent',
                color:viewMode===m.id?'var(--sage)':'var(--text3)',
                boxShadow:viewMode===m.id?'var(--shadow)':'none'}}>
              {m.icon} {m.label}
            </button>
          ))}
        </div>
      </div>

      {/* ── VIEW: BY PRODUCT ── */}
      {viewMode==='product' && (
        <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:16,alignItems:'start'}}>

          {/* Left: product list */}
          <div>
            <input className="input" placeholder="⌕ Search products..." value={search}
              onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}}/>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {filtered.map(({product:p, eligible, claims})=>{
                const isSelected = selected===p.id;
                const hasInsufficient = claims.some(c=>c.status==='insufficient');
                return (
                  <div key={p.id} onClick={()=>setSelected(isSelected?null:p.id)}
                    style={{
                      background:isSelected?'rgba(58,107,74,.08)':'var(--card)',
                      border:`1.5px solid ${isSelected?'var(--sage)':'var(--border)'}`,
                      borderRadius:'var(--r-lg)',padding:'12px 14px',cursor:'pointer',
                      transition:'all .15s',
                    }}
                    onMouseOver={e=>{if(!isSelected)e.currentTarget.style.borderColor='var(--sage2)'}}
                    onMouseOut={e=>{if(!isSelected)e.currentTarget.style.borderColor='var(--border)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:13,color:'var(--text)',marginBottom:3}}>{p.name}</div>
                        <div style={{fontSize:11,color:'var(--text3)'}}>{p.category||'—'}</div>
                      </div>
                      <div style={{flexShrink:0,textAlign:'right'}}>
                        <div style={{fontSize:16,fontWeight:800,color:eligible.length>0?'var(--sage)':'var(--text3)',fontFamily:'var(--mono)'}}>
                          {eligible.length}
                        </div>
                        <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em'}}>
                          {eligible.length===1?'claim':'claims'}
                        </div>
                      </div>
                    </div>
                    {/* Eligible claim pills */}
                    {eligible.length>0&&(
                      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:8}}>
                        {eligible.slice(0,4).map(c=>(
                          <span key={c} style={{fontSize:10,fontWeight:600,background:'rgba(30,122,69,.12)',color:'#1E7A45',padding:'1px 7px',borderRadius:99}}>{c}</span>
                        ))}
                        {eligible.length>4&&<span style={{fontSize:10,color:'var(--text3)'}}>+{eligible.length-4} more</span>}
                      </div>
                    )}
                    {hasInsufficient&&eligible.length===0&&(
                      <div style={{fontSize:10,color:'var(--amber)',marginTop:6}}>⚠ Some data missing — complete nutrient profile for full assessment</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right: claim detail */}
          <div>
            {!selectedClaims ? (
              <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-xl)',padding:'48px',textAlign:'center'}}>
                <div style={{fontSize:32,marginBottom:12}}>🏷</div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--text2)',marginBottom:6}}>Select a product</div>
                <div style={{fontSize:13,color:'var(--text3)'}}>Click any product on the left to see its full nutrition claims assessment</div>
              </div>
            ) : (
              <div>
                {/* Product header */}
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:'16px 20px',marginBottom:14,boxShadow:'var(--shadow)'}}>
                  <div style={{fontFamily:"'DM Serif Display',Georgia,serif",fontSize:20,color:'var(--text)',marginBottom:4}}>{selectedClaims.product.name}</div>
                  <div style={{fontSize:12,color:'var(--text3)',display:'flex',gap:14,flexWrap:'wrap'}}>
                    <span>Category: <strong style={{color:'var(--text2)'}}>{selectedClaims.product.category||'—'}</strong></span>
                    <span>Energy: <strong style={{color:'var(--text2)'}}>{selectedClaims.product.energy!=null?`${selectedClaims.product.energy} kJ (${Claims.kcal(selectedClaims.product.energy).toFixed(0)} kcal)`:' — '}</strong></span>
                    <span>Form: <strong style={{color:'var(--text2)'}}>{Claims.isLiquid(selectedClaims.product)?'Liquid (per 100ml)':'Solid (per 100g)'}</strong></span>
                    <span style={{color:selectedClaims.eligible.length>0?'#1E7A45':'var(--text3)',fontWeight:700}}>
                      {selectedClaims.eligible.length} eligible claim{selectedClaims.eligible.length!==1?'s':''}
                    </span>
                  </div>
                </div>

                {/* Claims by group */}
                {CLAIM_GROUPS.map(group=>{
                  const groupClaims = selectedClaims.claims.filter(c=>group.claims.includes(c.claim));
                  if(!groupClaims.length) return null;
                  return (
                    <div key={group.label} className="card" style={{marginBottom:12}}>
                      <div className="card-header">
                        <span className="card-title">{group.label}</span>
                        <span style={{fontSize:12,color:groupClaims.some(c=>c.status==='eligible')?'#1E7A45':'var(--text3)'}}>
                          {groupClaims.filter(c=>c.status==='eligible').length}/{groupClaims.length} eligible
                        </span>
                      </div>
                      <div style={{padding:'8px 0'}}>
                        {groupClaims.map((c,i)=>(
                          <div key={i} style={{
                            display:'flex',alignItems:'flex-start',gap:12,
                            padding:'10px 18px',
                            borderBottom:i<groupClaims.length-1?'1px solid var(--border)':'none',
                          }}>
                            <div style={{
                              width:22,height:22,borderRadius:6,flexShrink:0,marginTop:1,
                              display:'flex',alignItems:'center',justifyContent:'center',
                              background:statusBg[c.status],
                              fontSize:11,fontWeight:800,color:statusColor[c.status],
                            }}>{statusIcon[c.status]}</div>
                            <div style={{flex:1}}>
                              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                                <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>{c.claim}</span>
                                <span style={{fontSize:11,fontWeight:700,color:statusColor[c.status],background:statusBg[c.status],padding:'1px 8px',borderRadius:99}}>
                                  {statusLabel[c.status]}
                                </span>
                              </div>
                              <div style={{fontSize:12,color:'var(--text3)',marginTop:3,fontFamily:'var(--mono)'}}>
                                {c.condition}
                              </div>
                              {c.notes&&(
                                <div style={{fontSize:11,color:'var(--amber)',marginTop:2,display:'flex',gap:4,alignItems:'flex-start'}}>
                                  <span style={{flexShrink:0}}>→</span><span>{c.notes}</span>
                                </div>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}

                {/* Legal note */}
                <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.7,padding:'12px 0',borderTop:'1px solid var(--border)',marginTop:4}}>
                  ⚠ Based on EU Regulation (EC) No 1924/2006. Claim eligibility requires verification by a qualified regulatory professional before use on product labelling or marketing materials.
                  Claims marked "Benchmark required" require a comparative product. "Formulation data required" claims cannot be assessed from nutrition values alone.
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── VIEW: MATRIX ── */}
      {viewMode==='matrix' && (
        <div>
          {/* Summary row */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,marginBottom:16}}>
            {CLAIM_GROUPS.map(g=>{
              const claimsInGroup = g.claims;
              const eligCount = allClaims.reduce((s,{claims})=>
                s + claims.filter(c=>claimsInGroup.includes(c.claim)&&c.status==='eligible').length, 0);
              const totalPossible = allClaims.length * claimsInGroup.length;
              const pct = totalPossible > 0 ? (eligCount/totalPossible*100) : 0;
              return (
                <div key={g.label} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:'12px 14px',textAlign:'center',boxShadow:'var(--shadow)'}}>
                  <div style={{fontSize:16,marginBottom:4}}>{g.label.split(' ')[0]}</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:18,fontWeight:700,color:pct>40?'#1E7A45':pct>15?'var(--amber)':'var(--text3)'}}>{pct.toFixed(0)}%</div>
                  <div style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em'}}>{g.label.slice(2)} eligible</div>
                </div>
              );
            })}
          </div>

          {/* Matrix table */}
          <div className="card">
            <div style={{overflowX:'auto'}}>
              <table style={{minWidth:1100}}>
                <thead>
                  <tr>
                    <th style={{width:180,position:'sticky',left:0,background:'var(--bg3)',zIndex:2}}>Product</th>
                    {CLAIM_NAMES.map(c=>(
                      <th key={c} style={{fontSize:9,letterSpacing:'.04em',textAlign:'center',maxWidth:70,whiteSpace:'normal',lineHeight:1.3,padding:'8px 6px'}}>{c}</th>
                    ))}
                    <th style={{textAlign:'center'}}>Eligible</th>
                  </tr>
                </thead>
                <tbody>
                  {allClaims.map(({product:p, claims, eligible})=>(
                    <tr key={p.id} onClick={()=>{setSelected(p.id);setViewMode('product');}}
                      style={{cursor:'pointer'}}>
                      <td style={{fontWeight:600,color:'var(--text)',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',position:'sticky',left:0,background:'var(--card)',zIndex:1}}>
                        {p.name}
                        <div style={{fontSize:10,color:'var(--text3)',fontWeight:400}}>{p.category}</div>
                      </td>
                      {CLAIM_NAMES.map(cn=>{
                        const c = claims.find(x=>x.claim===cn);
                        if(!c) return <td key={cn}/>;
                        const bg = {
                          eligible:'rgba(30,122,69,.15)',
                          ineligible:'rgba(179,58,46,.1)',
                          insufficient:'rgba(200,98,26,.1)',
                          benchmark:'rgba(155,170,148,.08)',
                          formulation:'rgba(155,170,148,.08)',
                        }[c.status];
                        const col = statusColor[c.status];
                        const icon = statusIcon[c.status];
                        return (
                          <td key={cn} style={{padding:'4px 6px',textAlign:'center'}}>
                            <div style={{width:28,height:22,margin:'0 auto',borderRadius:4,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:col}}>
                              {icon}
                            </div>
                          </td>
                        );
                      })}
                      <td style={{textAlign:'center',fontFamily:'var(--mono)',fontWeight:800,
                        color:eligible.length>3?'#1E7A45':eligible.length>0?'var(--amber)':'var(--text3)',fontSize:14}}>
                        {eligible.length}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {/* Legend */}
            <div style={{padding:'10px 18px',borderTop:'1px solid var(--border)',background:'var(--bg3)',display:'flex',gap:20,flexWrap:'wrap',fontSize:11}}>
              {Object.entries(statusLabel).map(([k,v])=>(
                <span key={k} style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{width:18,height:14,borderRadius:3,background:statusBg[k],display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800,color:statusColor[k]}}>{statusIcon[k]}</span>
                  <span style={{color:'var(--text3)'}}>{v}</span>
                </span>
              ))}
            </div>
          </div>

          {/* Legal note */}
          <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.7,marginTop:14,padding:'12px 16px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r)'}}>
            ⚖ Source: EU Regulation (EC) No 1924/2006 on nutrition and health claims. Valid for EU member states including Spain (AESAN).
            All assessments require review by a qualified regulatory professional before use in labelling or marketing. "○" claims require additional data (benchmark product or formulation data) before eligibility can be confirmed.
          </div>
        </div>
      )}
    </div>
  );
};

// MAIN APP
// ════════════════════════════════════════════════════════════════════
const App = () => {
  const [page, setPage] = useState('dashboard');
  const [products, setProducts] = useState(SAMPLE_PRODUCTS);
  const [isSampleData, setIsSampleData] = useState(true);
  const scored = useMemo(()=>products.map(p=>({...Engine.calcAll(p),id:p.id})),[products]);

  const pages = {
    dashboard: {label:'Dashboard',icon:'dashboard',component:<Dashboard products={products} scored={scored}/>},
    products:  {label:'Products',icon:'products',component:<Products products={products} setProducts={setProducts} isSample={isSampleData} setSample={setIsSampleData}/>},
    heatmap:   {label:'Heatmap',icon:'heatmap',component:<Heatmap products={products} scored={scored}/>},
    claims:    {label:'EU Claims',icon:'claims',component:<ClaimsPage products={products}/>},
    reform:    {label:'Reformulation',icon:'reform',component:<Reformulation products={products}/>},
    ai:        {label:'AI Insights',icon:'ai',component:<AIInsights products={products} scored={scored}/>},
  };

  const navGroups = [
    {label:'Analysis', items:['dashboard','heatmap']},
    {label:'Products', items:['products']},
    {label:'Regulatory', items:['claims']},
    {label:'Tools', items:['reform','ai']},
  ];

  const npmPass=scored.filter(s=>!s.npm?.error&&!s.npm?.lessHealthy).length;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="logo">
          <div className="logo-mark">Nutri<span>Signal</span></div>
          <div className="logo-sub">Regulatory Intelligence</div>
        </div>

        <nav className="nav">
          {navGroups.map(g=>(
            <div key={g.label}>
              <div className="nav-section-label">{g.label}</div>
              {g.items.map(k=>(
                <div key={k} className={`nav-item${page===k?' active':''}`} onClick={()=>setPage(k)}>
                  <span className="nav-icon">{pages[k].icon==='dashboard'?'⬛':pages[k].icon==='products'?'☰':pages[k].icon==='heatmap'?'▦':pages[k].icon==='reform'?'⟳':pages[k].icon==='claims'?'🏷':'✦'}</span>
                  <span>{pages[k].label}</span>
                  {k==='ai'&&<span style={{marginLeft:'auto',fontSize:9,background:'rgba(58,107,74,.1)',color:'var(--sage)',padding:'1px 5px',borderRadius:3,fontWeight:700}}>AI</span>}
                </div>
              ))}
            </div>
          ))}
        </nav>

        <div className="sidebar-footer">
          <div className="product-count">
            <div className="dot"/>
            <span>{products.length} products · {scored.length>0?(npmPass/scored.length*100).toFixed(0):0}% NPM pass</span>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <span className="topbar-title">{pages[page].label}</span>
          <div className="topbar-actions">
            {products.length===0&&<button className="btn btn-primary btn-sm" onClick={()=>setPage('products')}>+ Add products</button>}
            {page==='products'&&products.length>0&&<button className="btn btn-ghost btn-sm" onClick={()=>{
              const csv=['Product Name,Category,Energy (kJ),Total Fat (g),Saturated Fat (g),Total Sugars (g),Salt (g),Protein (g),Fibre (g),FVNL (%),Sales,NPM Type,HSR Category,NS Category'].concat(products.map(p=>[p.name,p.category,p.energy,p.totalFat,p.satFat,p.sugars,p.salt,p.protein,p.fibre,p.fvnl,p.sales,p.npmType,p.hsrCat,p.nsCat].join(','))).join('\n');
              const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='nutrisignal-products.csv';a.click();
            }}>↗ Export CSV</button>}
          </div>
        </div>
        <div className="page">{pages[page].component}</div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
